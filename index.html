<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mojito Multi-Stop Navi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; gap: 16px; }
    
    .header { text-align: center; color: #a0a0a0; font-size: 1.2rem; font-weight: bold; }
    
    .status-card { background-color: #1e1e1e; border-radius: 16px; padding: 20px; text-align: center; }
    .range-val { font-size: 3rem; font-weight: 800; color: #00ff7f; }
    .soc-val { font-size: 1.1rem; color: #e0e0e0; margin-bottom: 12px; }
    
    input[type=range] { width: 100%; height: 28px; -webkit-appearance: none; background: #333; border-radius: 14px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: #00ff7f; cursor: pointer; }

    .input-card { background-color: #1e1e1e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.85rem; color: #aaa; font-weight: bold; }
    input[type=text] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1.1rem; }

    .summary-card { background-color: #1e2923; border: 1px solid #00875a; border-radius: 16px; padding: 16px; display: none; flex-direction: column; gap: 8px; font-size: 0.95rem; }
    .summary-title { font-weight: bold; color: #00ff7f; font-size: 1.1rem; margin-bottom: 4px; }
    .stop-item { background: rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; margin-top: 6px; border-left: 3px solid #00ff7f; }

    .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 75px; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
    .btn-green { background-color: #00875a; }
    .btn-maps { background-color: #005a87; display: none; margin-top: 12px; }
    .status-msg { font-size: 0.95rem; color: #ffb703; text-align: center; min-height: 28px; font-weight: bold; padding: 5px; }
  </style>
</head>
<body>

  <div class="header">Next Mojito Smart Navi</div>

  <div class="status-card">
    <div class="range-val" id="range-display">~ 68 km</div>
    <div class="soc-val">Akkustand: <span id="soc-display">100</span> %</div>
    <input type="range" id="soc-slider" min="10" max="100" value="100" oninput="updateValues(this.value)">
  </div>

  <div class="input-card">
    <label for="destination-input">ZIELORT:</label>
    <input type="text" id="destination-input" placeholder="z. B. Paris Centre oder Zürich HB">
  </div>

  <div class="status-msg" id="status-msg">Bereit für Routenplanung</div>

  <button class="btn btn-green" id="plan-btn" onclick="planMultiStopRoute()">
    🔍 Route & Ladezeiten berechnen
  </button>

  <div class="summary-card" id="summary-card">
    <div class="summary-title">📊 Routen-Zusammenfassung</div>
    <div id="summary-content"></div>
    
    <button class="btn btn-maps" id="maps-btn" onclick="startGoogleMaps()">
      🗺️ Google Maps Navigation starten
    </button>
  </div>

<script>
  const MAX_RANGE_KM = 80;
  const SAFETY_BUFFER_PCT = 15;
  const CHARGE_RATE_MIN_PER_PCT = 1.5; 
  const AVG_SPEED_KMH = 45; 

  let generatedMapsUrl = "";

  function updateValues(soc) {
    document.getElementById('soc-display').innerText = soc;
    const usablePct = Math.max(0, soc - SAFETY_BUFFER_PCT);
    const range = Math.round((MAX_RANGE_KM * usablePct) / 100);
    document.getElementById('range-display').innerText = `~ ${range} km`;
  }

  function getCurrentLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });
  }

  async function geocodeDestination(destText) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destText)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }
    } catch(e) {}
    return null;
  }

  async function findChargerInRadius(currentPos, targetPos, maxRangeKm) {
    const radiusMeters = Math.max(maxRangeKm * 1000, 6000);
    const query = `
      [out:json];
      (
        node["amenity"="charging_station"](around:${radiusMeters},${currentPos.lat},${currentPos.lng});
        way["amenity"="charging_station"](around:${radiusMeters},${currentPos.lat},${currentPos.lng});
      );
      out center 60;
    `;
    
    try {
      const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: query });
      const data = await res.json();

      if (data.elements && data.elements.length > 0) {
        let bestCharger = null;
        let highestProgress = -999999;

        const directDistToTarget = getDistanceKm(currentPos.lat, currentPos.lng, targetPos.lat, targetPos.lng);

        data.elements.forEach(element => {
          const lat = element.lat || (element.center && element.center.lat);
          const lon = element.lon || (element.center && element.center.lon);
          if (!lat || !lon) return;

          const tags = element.tags || {};
          const name = (tags.name || "").toLowerCase();
          const operator = (tags.operator || "").toLowerCase();

          if (name.includes("supercharger") || name.includes("ionity") || name.includes("fastned") || operator.includes("tesla")) {
            return;
          }

          const distFromStart = getDistanceKm(currentPos.lat, currentPos.lng, lat, lon);
          const distToTarget = getDistanceKm(lat, lon, targetPos.lat, targetPos.lng);
          const progress = directDistToTarget - distToTarget;

          // WICHTIG: Die Station muss uns dem Ziel nennenswert näherbringen (progress > 5km) 
          // und im Reichweiten-Radius liegen, aber nicht das Ziel schon "überspringen"
          if (distFromStart <= maxRangeKm && progress > 5 && distToTarget > 10) {
            const score = distFromStart + (progress * 0.5);
            if (score > highestProgress) {
              highestProgress = score;
              bestCharger = { lat: lat, lon: lon, name: tags.name || "Ladestation (Typ 2 / Schuko)", dist: distFromStart };
            }
          }
        });
        return bestCharger;
      }
    } catch(e) {}
    return null;
  }

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  async function planMultiStopRoute() {
    const destText = document.getElementById('destination-input').value.trim();
    const status = document.getElementById('status-msg');
    const summaryCard = document.getElementById('summary-card');
    const summaryContent = document.getElementById('summary-content');
    const mapsBtn = document.getElementById('maps-btn');

    if (!destText) { alert("Bitte gib ein Ziel ein!"); return; }

    status.innerText = "📍 Ermittle Standort & Ziel-Koordinaten...";
    const startCoords = await getCurrentLocation();
    const destCoords = await geocodeDestination(destText);

    if (!startCoords || !destCoords) { alert("GPS oder Zielort konnte nicht aufgelöst werden!"); return; }

    let currentSoc = parseFloat(document.getElementById('soc-slider').value);
    let currentPos = { lat: startCoords.lat, lng: startCoords.lng };
    
    const waypoints = [];
    const stopsSummary = [];
    const routePoints = [{ lat: startCoords.lat, lng: startCoords.lng }];
    let totalChargeTimeMin = 0;
    let stopCounter = 0;
    const maxIterations = 15;

    summaryCard.style.display = "none";
    mapsBtn.style.display = "none";

    const totalStraightDist = getDistanceKm(startCoords.lat, startCoords.lng, destCoords.lat, destCoords.lng);
    const usableRangeKm = Math.round((MAX_RANGE_KM * Math.max(0, currentSoc - SAFETY_BUFFER_PCT)) / 100);
    let estimatedStops = totalStraightDist > usableRangeKm ? Math.ceil(totalStraightDist / usableRangeKm) - 1 : 0;

    while (stopCounter < maxIterations) {
      const distToDest = getDistanceKm(currentPos.lat, currentPos.lng, destCoords.lat, destCoords.lng);
      const currentUsableRange = Math.round((MAX_RANGE_KM * Math.max(0, currentSoc - SAFETY_BUFFER_PCT)) / 100);

      // Strengerer Check: Nur abbrechen, wenn das Ziel wirklich in einem Rutsch erreichbar ist
      if (distToDest <= currentUsableRange * 0.85) {
        routePoints.push({ lat: destCoords.lat, lng: destCoords.lng });
        break; 
      }

      stopCounter++;
      status.innerText = `🔄 Berechne Ladestopp ${stopCounter} (von ~${estimatedStops})...`;

      const charger = await findChargerInRadius(currentPos, destCoords, currentUsableRange);

      if (!charger) {
        status.innerText = `⚠️ Stopp ${stopCounter}: Keine weitere Ladesäule im Radius gefunden. Versuche Direkt-Reststrecke...`;
        stopCounter--;
        routePoints.push({ lat: destCoords.lat, lng: destCoords.lng });
        break;
      }

      const usedPct = (charger.dist / MAX_RANGE_KM) * 100;
      const arrivalSoc = Math.max(0, currentSoc - usedPct);
      const targetChargeSoc = 85; 
      const chargeNeededPct = Math.max(0, targetChargeSoc - arrivalSoc);
      const chargeTimeMin = Math.round(chargeNeededPct * CHARGE_RATE_MIN_PER_PCT);

      totalChargeTimeMin += chargeTimeMin;

      waypoints.push(`${charger.lat},${charger.lon}`);
      routePoints.push({ lat: charger.lat, lng: charger.lon });

      stopsSummary.push({
        num: stopCounter,
        name: charger.name,
        dist: Math.round(charger.dist),
        arrSoc: Math.round(arrivalSoc),
        chargeTime: chargeTimeMin
      });

      currentPos = { lat: charger.lat, lng: charger.lon };
      currentSoc = targetChargeSoc; 
    }

    if (routePoints[routePoints.length - 1].lat !== destCoords.lat) {
      routePoints.push({ lat: destCoords.lat, lng: destCoords.lng });
    }

    let totalDistKm = 0;
    for (let i = 0; i < routePoints.length - 1; i++) {
      totalDistKm += getDistanceKm(routePoints[i].lat, routePoints[i].lng, routePoints[i+1].lat, routePoints[i+1].lng);
    }

    const driveTimeMin = Math.round((totalDistKm / AVG_SPEED_KMH) * 60);
    const totalTripTimeMin = driveTimeMin + totalChargeTimeMin;

    const driveHours = Math.floor(driveTimeMin / 60);
    const driveMins = driveTimeMin % 60;
    const chargeHours = Math.floor(totalChargeTimeMin / 60);
    const chargeMins = totalChargeTimeMin % 60;
    const totalHours = Math.floor(totalTripTimeMin / 60);
    const totalMins = totalTripTimeMin % 60;

    generatedMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${startCoords.lat},${startCoords.lng}&destination=${encodeURIComponent(destText)}&travelmode=two-wheeler`;
    if (waypoints.length > 0) {
      generatedMapsUrl += `&waypoints=${waypoints.join('|')}`;
    }

    let html = `<div><strong>Gesamtdistanz:</strong> ~${Math.round(totalDistKm)} km</div>`;
    html += `<div><strong>Gesamtdauer:</strong> ~${totalHours}h ${totalMins}m</div>`;
    html += `<div style="color: #aaa; font-size: 0.85rem; margin-bottom: 8px;">(🛵 Fahrt: ${driveHours}h ${driveMins}m | 🔌 Laden: ${chargeHours}h ${chargeMins}m)</div>`;
    
    if (stopsSummary.length > 0) {
      html += `<div style="font-weight: bold; margin-top: 6px;">Geplante Ladestopps (${stopsSummary.length}):</div>`;
      stopsSummary.forEach(s => {
        html += `<div class="stop-item">`;
        html += `<strong>Stopp ${s.num}:</strong> ${s.name} (nach ~${s.dist} km)<br>`;
        html += `Ankunft mit ~${s.arrSoc}% Akku ➔ <strong>${s.chargeTime} Min. laden</strong> (auf 85%)`;
        html += `</div>`;
      });
    } else {
      html += `<div style="margin-top: 8px; color: #00ff7f; font-weight: bold;">Kein Ladestopp erforderlich! Direktziel erreichbar.</div>`;
    }

    summaryContent.innerHTML = html;
    summaryCard.style.display = "flex";
    mapsBtn.style.display = "flex";
    status.innerText = "✅ Routen- und Ladeplanung erfolgreich abgeschlossen!";
  }

  function startGoogleMaps() {
    if (generatedMapsUrl) {
      window.location.href = generatedMapsUrl;
    }
  }
</script>

</body>
</html>
