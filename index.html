<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mojito Smart Navi v2</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; gap: 16px; }
    
    .header { text-align: center; color: #a0a0a0; font-size: 1.2rem; font-weight: bold; }
    
    .status-card { background-color: #1e1e1e; border-radius: 16px; padding: 20px; text-align: center; }
    .range-val { font-size: 3rem; font-weight: 800; color: #00ff7f; }
    .soc-val { font-size: 1.1rem; color: #e0e0e0; margin-bottom: 12px; }
    
    input[type=range] { width: 100%; height: 28px; -webkit-appearance: none; background: #333; border-radius: 14px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: #00ff7f; cursor: pointer; }

    .input-card { background-color: #1e1e1e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.85rem; color: #aaa; font-weight: bold; }
    input[type=text] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1.1rem; }

    .summary-card { background-color: #1e2923; border: 1px solid #00875a; border-radius: 16px; padding: 16px; display: none; flex-direction: column; gap: 8px; font-size: 0.95rem; }
    .summary-title { font-weight: bold; color: #00ff7f; font-size: 1.1rem; margin-bottom: 4px; }
    .stop-item { background: rgba(255,255,255,0.08); padding: 10px; border-radius: 8px; margin-top: 6px; border-left: 3px solid #00ff7f; }

    .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 75px; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
    .btn-green { background-color: #00875a; }
    .btn-maps { background-color: #005a87; display: none; margin-top: 12px; }
    .status-msg { font-size: 0.95rem; color: #ffb703; text-align: center; min-height: 28px; font-weight: bold; padding: 5px; }
  </style>
</head>
<body>

  <div class="header">Next Mojito Smart Navi</div>

  <div class="status-card">
    <div class="range-val" id="range-display">~ 68 km</div>
    <div class="soc-val">Akkustand: <span id="soc-display">100</span> %</div>
    <input type="range" id="soc-slider" min="10" max="100" value="100" oninput="updateValues(this.value)">
  </div>

  <div class="input-card">
    <label for="destination-input">ZIELORT:</label>
    <input type="text" id="destination-input" placeholder="z. B. Zürich HB oder Paris">
  </div>

  <div class="status-msg" id="status-msg">Bereit für Neustart</div>

  <button class="btn btn-green" id="plan-btn" onclick="startFreshPlanning()">
    🚀 Route & Ladezeiten berechnen
  </button>

  <div class="summary-card" id="summary-card">
    <div class="summary-title">📊 Routen-Zusammenfassung</div>
    <div id="summary-content"></div>
    
    <button class="btn btn-maps" id="maps-btn" onclick="startGoogleMaps()">
      🗺️ Google Maps Navigation starten
    </button>
  </div>

<script>
  // FAHRZEUG-SPEZIFIKATIONEN (Next Mojito)
  const MAX_RANGE_KM = 80;
  const SAFETY_BUFFER_PCT = 15;
  const CHARGE_RATE_MIN_PER_PCT = 1.5; // ~2.5h für 0-100%
  const AVG_SPEED_KMH = 45; // Landstraße/Stadt Durchschnitt

  let generatedMapsUrl = "";

  function updateValues(soc) {
    document.getElementById('soc-display').innerText = soc;
    const usablePct = Math.max(0, soc - SAFETY_BUFFER_PCT);
    const range = Math.round((MAX_RANGE_KM * usablePct) / 100);
    document.getElementById('range-display').innerText = `~ ${range} km`;
  }

  function getCurrentLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });
  }

  async function geocodeDestination(destText) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destText)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }
    } catch(e) {}
    return null;
  }

  // Haversine-Formel zur Distanzberechnung (Luftlinie in km)
  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
  }

  // EINZELNE SUCH-FUNKTION: Findet EINFACH die beste Ladesäule für eine Etappen-Strecke
  async function fetchSingleCharger(fromPos, toPos, searchRadiusKm) {
    const radiusMeters = Math.max(searchRadiusKm * 1000, 8000);
    const query = `
      [out:json];
      (
        node["amenity"="charging_station"](around:${radiusMeters},${fromPos.lat},${fromPos.lng});
        way["amenity"="charging_station"](around:${radiusMeters},${fromPos.lat},${fromPos.lng});
      );
      out center 50;
    `;
    
    try {
      const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: query });
      const data = await res.json();

      if (data && data.elements && data.elements.length > 0) {
        let bestCandidate = null;
        let highestScore = -999999;
        const currentDistToDest = getDistanceKm(fromPos.lat, fromPos.lng, toPos.lat, toPos.lng);

        data.elements.forEach(el => {
          const lat = el.lat || (el.center && el.center.lat);
          const lon = el.lon || (el.center && el.center.lon);
          if (!lat || !lon) return;

          const tags = el.tags || {};
          const name = (tags.name || "").toLowerCase();
          const operator = (tags.operator || "").toLowerCase();

          // Reine DC-Schnelllader übergehen
          if (name.includes("supercharger") || name.includes("ionity") || name.includes("fastned") || operator.includes("tesla")) {
            return;
          }

          const distFromStart = getDistanceKm(fromPos.lat, fromPos.lng, lat, lon);
          const distToDest = getDistanceKm(lat, lon, toPos.lat, toPos.lng);
          const progress = currentDistToDest - distToDest;

          // Station muss in der nutzbaren Reichweite liegen und Fortschritt bieten
          if (distFromStart <= searchRadiusKm && progress > 1) {
            const score = distFromStart + (progress * 0.4);
            if (score > highestScore) {
              highestScore = score;
              bestCandidate = { lat, lon, name: tags.name || "Ladestation", dist: distFromStart };
            }
          }
        });

        return bestCandidate;
      }
    } catch(e) {}
    return null;
  }

  // HAUPT-LOGIK BEIM NEUSTART
  async function startFreshPlanning() {
    const destText = document.getElementById('destination-input').value.trim();
    const status = document.getElementById('status-msg');
    const summaryCard = document.getElementById('summary-card');
    const summaryContent = document.getElementById('summary-content');
    const mapsBtn = document.getElementById('maps-btn');

    if (!destText) { alert("Bitte gib ein Ziel ein!"); return; }

    summaryCard.style.display = "none";
    mapsBtn.style.display = "none";
    status.innerText = "📍 Ermittle Standorte...";

    const startCoords = await getCurrentLocation();
    const destCoords = await geocodeDestination(destText);

    if (!startCoords || !destCoords) { 
      alert("GPS-Standort oder Zielort konnte nicht aufgelöst werden!"); 
      status.innerText = "❌ Fehler bei der Standortbestimmung";
      return; 
    }

    let currentSoc = parseFloat(document.getElementById('soc-slider').value);
    let currentPos = { lat: startCoords.lat, lng: startCoords.lng };

    const totalDirectKm = getDistanceKm(startCoords.lat, startCoords.lng, destCoords.lat, destCoords.lng);
    const initialUsableRange = Math.round((MAX_RANGE_KM * Math.max(0, currentSoc - SAFETY_BUFFER_PCT)) / 100);

    // 1. ZIEL DIREKT ERREICHBAR?
    if (totalDirectKm <= initialUsableRange * 0.85) {
      status.innerText = "✅ Ziel direkt erreichbar!";
      generatedMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${startCoords.lat},${startCoords.lng}&destination=${encodeURIComponent(destText)}&travelmode=two-wheeler`;
      
      summaryContent.innerHTML = `<div><strong>Luftlinie zum Ziel:</strong> ~${Math.round(totalDirectKm)} km</div><div style="color: #00ff7f; margin-top: 5px; font-weight: bold;">Kein Ladestopp erforderlich!</div>`;
      summaryCard.style.display = "flex";
      mapsBtn.style.display = "flex";
      return;
    }

    // 2. ANZAHLE DER SCHRITTE SCHÄTZEN (FOR-SCHLEIFE ANSTATT WHILE-ENDLOSSCHLEIFE)
    const neededStopsCount = Math.min(10, Math.ceil(totalDirectKm / (MAX_RANGE_KM * 0.7)));
    status.innerText = `ℹ️ Benötige ca. ${neededStopsCount} Ladestopp(s). Starte Suche...`;

    const waypoints = [];
    const stopsSummary = [];
    const routePoints = [{ lat: startCoords.lat, lng: startCoords.lng }];
    let totalChargeTimeMin = 0;
    let totalDrivenKm = 0;

    // KONTROLLIERTE FOR-SCHLEIFE (Keine Endlosschleife möglich!)
    for (let step = 1; step <= neededStopsCount; step++) {
      const remainingDistToDest = getDistanceKm(currentPos.lat, currentPos.lng, destCoords.lat, destCoords.lng);
      const currentRangeKm = Math.round((MAX_RANGE_KM * Math.max(0, currentSoc - SAFETY_BUFFER_PCT)) / 100);

      // Falls die verbleibende Reststrecke nun mit dem aktuellen Akku klappt -> Abbruch der Suche
      if (remainingDistToDest <= currentRangeKm * 0.85) {
        break;
      }

      status.innerText = `🔄 Suche Ladestopp ${step} von ${neededStopsCount}...`;
      const charger = await fetchSingleCharger(currentPos, destCoords, currentRangeKm);

      if (!charger) {
        status.innerText = `⚠️ Stopp ${step}: Keine Säule im Umkreis. Schließe Routenplanung ab...`;
        break;
      }

      // Daten für diesen Stopp berechnen
      const usedPct = (charger.dist / MAX_RANGE_KM) * 100;
      const arrSoc = Math.max(0, currentSoc - usedPct);
      const targetSoc = 85; 
      const chargeNeededPct = Math.max(0, targetSoc - arrSoc);
      const chargeTimeMin = Math.round(chargeNeededPct * CHARGE_RATE_MIN_PER_PCT);

      totalChargeTimeMin += chargeTimeMin;
      totalDrivenKm += charger.dist;

      waypoints.push(`${charger.lat},${charger.lon}`);
      routePoints.push({ lat: charger.lat, lng: charger.lon });

      stopsSummary.push({
        num: step,
        name: charger.name,
        dist: Math.round(charger.dist),
        arrSoc: Math.round(arrSoc),
        chargeTime: chargeTimeMin
      });

      // Position und Akku für die nächste Etappe aktualisieren
      currentPos = { lat: charger.lat, lng: charger.lon };
      currentSoc = targetSoc;
    }

    // Letzten Streckenabschnitt bis zum Endziel dazurechnen
    routePoints.push({ lat: destCoords.lat, lng: destCoords.lng });
    const lastLegKm = getDistanceKm(currentPos.lat, currentPos.lng, destCoords.lat, destCoords.lng);
    totalDrivenKm += lastLegKm;

    // Zeiten ausrechnen
    const driveTimeMin = Math.round((totalDrivenKm / AVG_SPEED_KMH) * 60);
    const totalTripTimeMin = driveTimeMin + totalChargeTimeMin;

    const driveH = Math.floor(driveTimeMin / 60);
    const driveM = driveTimeMin % 60;
    const chargeH = Math.floor(totalChargeTimeMin / 60);
    const chargeM = totalChargeTimeMin % 60;
    const totalH = Math.floor(totalTripTimeMin / 60);
    const totalM = totalTripTimeMin % 60;

    // Google Maps Link bauen
    generatedMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${startCoords.lat},${startCoords.lng}&destination=${encodeURIComponent(destText)}&travelmode=two-wheeler`;
    if (waypoints.length > 0) {
      generatedMapsUrl += `&waypoints=${waypoints.join('|')}`;
    }

    // UI-Zusammenfassung rendern
    let html = `<div><strong>Gesamtdistanz (geschätzt):</strong> ~${Math.round(totalDrivenKm * 1.15)} km</div>`;
    html += `<div><strong>Gesamtdauer:</strong> ~${totalH}h ${totalM}m</div>`;
    html += `<div style="color: #aaa; font-size: 0.85rem; margin-bottom: 8px;">(🛵 Fahrt: ${driveH}h ${driveM}m | 🔌 Laden: ${chargeH}h ${chargeM}m)</div>`;
    
    if (stopsSummary.length > 0) {
      html += `<div style="font-weight: bold; margin-top: 6px;">Geplante Ladestopps (${stopsSummary.length}):</div>`;
      stopsSummary.forEach(s => {
        html += `<div class="stop-item">`;
        html += `<strong>Stopp ${s.num}:</strong> ${s.name} (nach ~${s.dist} km)<br>`;
        html += `Ankunft mit ~${s.arrSoc}% Akku ➔ <strong>${s.chargeTime} Min. laden</strong> (auf 85%)`;
        html += `</div>`;
      });
    }

    summaryContent.innerHTML = html;
    summaryCard.style.display = "flex";
    mapsBtn.style.display = "flex";
    status.innerText = "✅ Routen- und Ladeplanung erfolgreich abgeschlossen!";
  }

  function startGoogleMaps() {
    if (generatedMapsUrl) {
      window.location.href = generatedMapsUrl;
    }
  }
</script>

</body>
</html>
