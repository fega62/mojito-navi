<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mojito Smart Route</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; gap: 16px; }
    
    .header { text-align: center; color: #a0a0a0; font-size: 1.2rem; font-weight: bold; }
    
    .status-card { background-color: #1e1e1e; border-radius: 16px; padding: 20px; text-align: center; }
    .range-val { font-size: 3rem; font-weight: 800; color: #00ff7f; }
    .soc-val { font-size: 1.1rem; color: #e0e0e0; margin-bottom: 12px; }
    
    input[type=range] { width: 100%; height: 28px; -webkit-appearance: none; background: #333; border-radius: 14px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: #00ff7f; cursor: pointer; }

    .input-card { background-color: #1e1e1e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.85rem; color: #aaa; font-weight: bold; }
    input[type=text] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1.1rem; }

    .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 75px; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
    .btn-green { background-color: #00875a; }
    .status-msg { font-size: 0.95rem; color: #ffb703; text-align: center; min-height: 28px; font-weight: bold; padding: 5px; }
  </style>
</head>
<body>

  <div class="header">Next Mojito Smart Navi</div>

  <div class="status-card">
    <div class="range-val" id="range-display">~ 68 km</div>
    <div class="soc-val">Akkustand: <span id="soc-display">100</span> %</div>
    <input type="range" id="soc-slider" min="10" max="100" value="100" oninput="updateValues(this.value)">
  </div>

  <div class="input-card">
    <label for="destination-input">ZIELORT:</label>
    <input type="text" id="destination-input" placeholder="z. B. Zürich HB">
  </div>

  <div class="status-msg" id="status-msg">Bereit für Routenplanung</div>

  <button class="btn btn-green" onclick="startRechweitenAnalyse()">
    🛵 Route & Ladestopp berechnen
  </button>

<script>
  const MAX_RANGE = 80;
  const SAFETY_BUFFER = 15;

  function updateValues(soc) {
    document.getElementById('soc-display').innerText = soc;
    const usablePct = Math.max(0, soc - SAFETY_BUFFER);
    const range = Math.round((MAX_RANGE * usablePct) / 100);
    document.getElementById('range-display').innerText = `~ ${range} km`;
  }

  function getCurrentLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });
  }

  async function geocodeDestination(destText) {
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destText)}`);
      const data = await res.json();
      if (data && data.length > 0) {
        return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
      }
    } catch(e) {}
    return null;
  }

  // Erfasst ALLE Ladesäulen im Umkreis und schließt nur reine Schnelllader/DC aus
  async function findChargerOnRoute(start, dest, maxDistKm) {
    const radiusMeters = Math.max(maxDistKm * 1000, 5000); // Mindestens 5km Suchradius
    
    // Overpass Query: Nimmt Nodes (Punkte) und Ways (Flächen)
    const query = `
      [out:json];
      (
        node["amenity"="charging_station"](around:${radiusMeters},${start.lat},${start.lng});
        way["amenity"="charging_station"](around:${radiusMeters},${start.lat},${start.lng});
      );
      out center 50;
    `;
    
    try {
      const res = await fetch("https://overpass-api.de/api/interpreter", {
        method: "POST",
        body: query
      });
      const data = await res.json();

      if (data.elements && data.elements.length > 0) {
        let bestCharger = null;
        let lowestDetourScore = 999999;

        data.elements.forEach(element => {
          // Breite Koordinatenerfassung (auch für Flächen/Ways)
          const lat = element.lat || (element.center && element.center.lat);
          const lon = element.lon || (element.center && element.center.lon);

          if (!lat || !lon) return;

          const tags = element.tags || {};
          const name = (tags.name || "").toLowerCase();
          const operator = (tags.operator || "").toLowerCase();
          const socketCcs = tags["socket:ccs"] || "no";
          const socketType2 = tags["socket:type2"] || "unknown";

          // Ausschlussfilter: Tesla Supercharger, Ionity, Fastned & reine DC-Lader
          if (
            name.includes("supercharger") || 
            name.includes("ionity") || 
            name.includes("fastned") || 
            operator.includes("tesla") || 
            operator.includes("ionity") ||
            (socketCcs === "yes" && socketType2 === "no")
          ) {
            return; // Ausfiltern
          }

          const distFromStart = getDistanceKm(start.lat, start.lng, lat, lon);
          const distToDest = getDistanceKm(lat, lon, dest.lat, dest.lng);
          const directDist = getDistanceKm(start.lat, start.lng, dest.lat, dest.lng);

          // Berechne den Umweg
          const detour = (distFromStart + distToDest) - directDist;

          // Akzeptiere Stationen innerhalb der Reichweite, die den Weg zum Ziel verkürzen
          if (distFromStart <= maxDistKm && distToDest < directDist) {
            if (detour < lowestDetourScore) {
              lowestDetourScore = detour;
              bestCharger = { lat: lat, lon: lon, name: tags.name || "Typ2/Schuko Ladestation" };
            }
          }
        });

        return bestCharger;
      }
    } catch(e) {
      console.error("Fehler bei Ladesäulenabfrage:", e);
    }
    return null;
  }

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  async function startRechweitenAnalyse() {
    const destText = document.getElementById('destination-input').value.trim();
    const status = document.getElementById('status-msg');

    if (!destText) {
      alert("Bitte gib ein Ziel ein!");
      return;
    }

    status.innerText = "📍 Ermittle Standort & Ziel...";
    const startCoords = await getCurrentLocation();
    const destCoords = await geocodeDestination(destText);

    if (!startCoords || !destCoords) {
      alert("GPS oder Zielort konnte nicht gefunden werden!");
      return;
    }

    const soc = document.getElementById('soc-slider').value;
    const usableRangeKm = Math.round((MAX_RANGE * Math.max(0, soc - SAFETY_BUFFER)) / 100);
    const directDistanceKm = getDistanceKm(startCoords.lat, startCoords.lng, destCoords.lat, destCoords.lng);

    if (directDistanceKm <= usableRangeKm * 0.85) {
      status.innerText = `✅ Ziel erreichbar (${Math.round(directDistanceKm)} km). Direkt-Route startet...`;
      setTimeout(() => {
        window.location.href = `https://www.google.com/maps/dir/?api=1&origin=${startCoords.lat},${startCoords.lng}&destination=${encodeURIComponent(destText)}&travelmode=two-wheeler`;
      }, 1200);
      return;
    }

    status.innerText = `🔋 Suche Ladestopp im Umkreis von ${usableRangeKm} km Richtung Ziel...`;

    const charger = await findChargerOnRoute(startCoords, destCoords, usableRangeKm);

    if (charger) {
      const chargerDist = Math.round(getDistanceKm(startCoords.lat, startCoords.lng, charger.lat, charger.lon));
      status.innerText = `⚡ Stopp gefunden: ${charger.name} (bei km ${chargerDist})!`;

      setTimeout(() => {
        window.location.href = `https://www.google.com/maps/dir/?api=1&origin=${startCoords.lat},${startCoords.lng}&destination=${encodeURIComponent(destText)}&waypoints=${charger.lat},${charger.lon}&travelmode=two-wheeler`;
      }, 1500);
    } else {
      status.innerText = "⚠️ Keine Ladestation direkt auf der Achse gefunden. Öffne Route...";
      setTimeout(() => {
        window.location.href = `https://www.google.com/maps/dir/?api=1&origin=${startCoords.lat},${startCoords.lng}&destination=${encodeURIComponent(destText)}&travelmode=two-wheeler`;
      }, 2000);
    }
  }
</script>

</body>
</html>
