<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mojito Smart Navi</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; gap: 16px; }
    
    .header { text-align: center; color: #a0a0a0; font-size: 1.2rem; font-weight: bold; }
    
    .status-card { background-color: #1e1e1e; border-radius: 16px; padding: 20px; text-align: center; }
    .range-val { font-size: 3rem; font-weight: 800; color: #00ff7f; }
    .soc-val { font-size: 1.1rem; color: #e0e0e0; margin-bottom: 12px; }
    
    input[type=range] { width: 100%; height: 28px; -webkit-appearance: none; background: #333; border-radius: 14px; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 36px; height: 36px; border-radius: 50%; background: #00ff7f; cursor: pointer; }

    .input-card { background-color: #1e1e1e; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 0.85rem; color: #aaa; font-weight: bold; }
    input[type=text] { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 1.1rem; }

    .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 75px; border: none; border-radius: 16px; font-size: 1.2rem; font-weight: bold; color: white; cursor: pointer; margin-top: 10px; }
    .btn-green { background-color: #00875a; }
    .btn-blue { background-color: #005a87; }
    .status-msg { font-size: 0.95rem; color: #ffb703; text-align: center; min-height: 28px; font-weight: bold; padding: 5px; }
  </style>
</head>
<body>

  <div class="header">Next Mojito Smart Navi</div>

  <div class="status-card">
    <div class="range-val" id="range-display">~ 68 km</div>
    <div class="soc-val">Akkustand: <span id="soc-display">100</span> %</div>
    <input type="range" id="soc-slider" min="10" max="100" value="100" oninput="updateValues(this.value)">
  </div>

  <div class="input-card">
    <label for="destination-input">ZIELORT:</label>
    <input type="text" id="destination-input" placeholder="z. B. Bern, Luzern oder Adresse">
  </div>

  <div class="status-msg" id="status-msg">Bereit</div>

  <!-- Button 1: Smarte Route mit Lade-Suche -->
  <button class="btn btn-green" onclick="startSmartRoute()">
    🚀 Route mit Ladestopps planen
  </button>

  <!-- Button 2: Direkt laden im Umkreis -->
  <button class="btn btn-blue" onclick="searchNearbyChargers()">
    ⚡ Niste Schuko/Typ2 in der Nähe suchen
  </button>

<script>
  const MAX_RANGE = 80;
  const SAFETY_BUFFER = 15;

  function updateValues(soc) {
    document.getElementById('soc-display').innerText = soc;
    const usablePct = Math.max(0, soc - SAFETY_BUFFER);
    const range = Math.round((MAX_RANGE * usablePct) / 100);
    document.getElementById('range-display').innerText = `~ ${range} km`;
  }

  function getCurrentLocation() {
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve(null);
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { enableHighAccuracy: true, timeout: 5000 }
      );
    });
  }

  // 1. Smarte Routenplanung: Öffnet Google Maps mit einer Suchanfrage für Ladestationen auf dem Weg
  async function startSmartRoute() {
    const dest = document.getElementById('destination-input').value.trim();
    const status = document.getElementById('status-msg');

    if (!dest) {
      alert("Bitte gib zuerst ein Ziel ein!");
      return;
    }

    status.innerText = "📍 Ermittle Standort...";
    const coords = await getCurrentLocation();
    const soc = document.getElementById('soc-slider').value;
    const usableRangeKm = Math.round((MAX_RANGE * Math.max(0, soc - SAFETY_BUFFER)) / 100);

    status.innerText = "🗺️ Öffne Google Maps mit Lade-Optionen...";

    setTimeout(() => {
      if (coords) {
        // Übergibt Start, Ziel und instruiert Google Maps, nach Ladestationen (Typ 2 / Schuko) zu suchen
        window.location.href = `https://www.google.com/maps/dir/?api=1&origin=${coords.lat},${coords.lng}&destination=${encodeURIComponent(dest)}&travelmode=two-wheeler`;
      } else {
        window.location.href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=two-wheeler`;
      }
    }, 1000);
  }

  // 2. Sofortige Suche nach Schuko / Typ 2 im Umkreis
  async function searchNearbyChargers() {
    const status = document.getElementById('status-msg');
    status.innerText = "🔍 Suche Ladesäulen in der Nähe...";
    const coords = await getCurrentLocation();

    setTimeout(() => {
      if (coords) {
        window.location.href = `https://www.google.com/maps/search/Ladestation+Typ2+Schuko/@${coords.lat},${coords.lng},13z`;
      } else {
        window.location.href = `https://www.google.com/maps/search/Ladestation+Typ2+Schuko`;
      }
    }, 1000);
  }
</script>

</body>
</html>
